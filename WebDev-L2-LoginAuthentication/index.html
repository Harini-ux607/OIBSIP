<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <header>
            <h1>My To-Do List</h1>
            <p>Organize your day and complete your tasks.</p>
        </header>


        <!-- Add Task -->
        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addTask">
                Add Task
            </button>

        </div>


        <!-- Pending Tasks -->
        <section class="task-section">

            <div class="section-header">

                <h2>Pending Tasks</h2>

                <span id="pendingCount">
                    0 pending
                </span>

            </div>

            <div id="pendingList" class="task-list">

                <p class="empty-message">
                    No pending tasks. You're all caught up! 🎉
                </p>

            </div>

        </section>


        <!-- Completed Tasks -->
        <section class="task-section completed-section">

            <div class="section-header">

                <h2>Completed Tasks</h2>

                <span id="completedCount">
                    0 completed
                </span>

            </div>

            <div id="completedList" class="task-list">

                <p class="empty-message">
                    No completed tasks yet.
                </p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
